name: Sync GitHub Project status

# Keeps the shared board (github.com/users/Ydony/projects/1) honest without manual dragging.
# Adapted from the original task/<n>-branch convention to signals this repo actually uses:
# PR lifecycle and issue-closing, referenced via "closes #N" / "fixes #N" in the PR body.
#
# Requires a repo secret PROJECT_TOKEN: a token with `project` scope (the default
# GITHUB_TOKEN cannot write to a user-level Project that spans multiple repos).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [closed, reopened]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwHOCnYbl84BiaoA";
            const statusField = "PVTSSF_lAHOCnYbl84BiaoAzhhSxlQ";
            const statusOptions = {
              "In Review": "950970f9",
              "In Test": "51366ce5",
              "Done": "fd1d5f70",
            };

            async function findProjectItem(contentNodeId) {
              const q = `query($id: ID!) {
                node(id: $id) {
                  ... on Issue { projectItems(first: 20) { nodes { id project { id } } } }
                  ... on PullRequest { projectItems(first: 20) { nodes { id project { id } } } }
                }
              }`;
              const res = await github.graphql(q, { id: contentNodeId });
              const items = res.node.projectItems.nodes;
              return items.find((i) => i.project.id === projectId);
            }

            async function setStatus(itemId, optionId) {
              const m = `mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $value }
                }) { projectV2Item { id } }
              }`;
              await github.graphql(m, { project: projectId, item: itemId, field: statusField, value: optionId });
            }

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              const body = pr.body || "";
              const matches = [...body.matchAll(/\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
              const issueNumbers = [...new Set(matches.map((m) => parseInt(m[2])))];

              let newStatus = null;
              if (context.payload.action === "closed" && pr.merged) {
                newStatus = statusOptions["In Test"];
              } else if (["opened", "reopened", "ready_for_review"].includes(context.payload.action)) {
                newStatus = statusOptions["In Review"];
              }
              if (!newStatus) return;

              for (const num of issueNumbers) {
                const issue = await github.rest.issues.get({ ...context.repo, issue_number: num });
                const item = await findProjectItem(issue.data.node_id);
                if (item) await setStatus(item.id, newStatus);
              }
            }

            if (context.eventName === "issues" && context.payload.action === "closed") {
              const issue = context.payload.issue;
              const item = await findProjectItem(issue.node_id);
              if (item) await setStatus(item.id, statusOptions["Done"]);
            }
