name: Sync GitHub Project status

# Keeps every Project board an issue belongs to in sync, without manual dragging.
# Works against the per-project board AND the shared cross-project roll-up, by
# resolving each board's own Status field/options by name at runtime rather than
# hardcoding IDs (every board has different field and option IDs).
#
# Triggers are the ones this repo actually uses - PR lifecycle and issue open/close -
# not the task/<n>-branch convention, which nothing here follows.
#
# Requires a repo secret PROJECT_TOKEN: a classic PAT with `project` AND `repo` scopes.
# `project` alone cannot read issues in private repos, so the sync silently fails there.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [opened, closed, reopened]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Every board this issue/PR sits on, so per-project and roll-up boards both update.
            async function projectItemsFor(contentNodeId) {
              const q = `query($id: ID!) {
                node(id: $id) {
                  ... on Issue { projectItems(first: 20) { nodes { id project { id title } } } }
                  ... on PullRequest { projectItems(first: 20) { nodes { id project { id title } } } }
                }
              }`;
              const res = await github.graphql(q, { id: contentNodeId });
              return res.node?.projectItems?.nodes ?? [];
            }

            // Each board defines its own field and option IDs - resolve by name, not hardcoded.
            const fieldCache = new Map();
            async function selectFieldFor(projectId, fieldName) {
              const key = `${projectId}:${fieldName}`;
              if (fieldCache.has(key)) return fieldCache.get(key);
              const q = `query($p: ID!, $f: String!) {
                node(id: $p) {
                  ... on ProjectV2 {
                    field(name: $f) {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`;
              const res = await github.graphql(q, { p: projectId, f: fieldName });
              const field = res.node?.field ?? null;
              fieldCache.set(key, field);
              return field;
            }

            async function setStatus(contentNodeId, statusName) {
              const items = await projectItemsFor(contentNodeId);
              for (const item of items) {
                const field = await selectFieldFor(item.project.id, "Status");
                if (!field) continue;
                const option = field.options.find((o) => o.name === statusName);
                if (!option) {
                  core.info(`"${statusName}" not an option on "${item.project.title}" - skipped`);
                  continue;
                }
                await github.graphql(
                  `mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $project, itemId: $item, fieldId: $field,
                      value: { singleSelectOptionId: $value }
                    }) { projectV2Item { id } }
                  }`,
                  { project: item.project.id, item: item.id, field: field.id, value: option.id }
                );
                core.info(`${item.project.title}: Status -> ${statusName}`);
              }
            }

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              const body = pr.body || "";
              const matches = [...body.matchAll(/\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
              const issueNumbers = [...new Set(matches.map((m) => parseInt(m[3])))];

              let newStatus = null;
              if (context.payload.action === "closed" && pr.merged) {
                newStatus = "In Test";
              } else if (["opened", "reopened", "ready_for_review"].includes(context.payload.action)) {
                newStatus = "In Review";
              }
              if (!newStatus) return;

              for (const num of issueNumbers) {
                const issue = await github.rest.issues.get({ ...context.repo, issue_number: num });
                await setStatus(issue.data.node_id, newStatus);
              }
            }

            // A brand-new issue belongs to no board and has no field values - without this
            // it silently lands outside the structure and never shows up in planning.
            async function onboardNewIssue(issue) {
              const repoQuery = `query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  projectsV2(first: 20) { nodes { id title } }
                }
              }`;
              const res = await github.graphql(repoQuery, {
                owner: context.repo.owner,
                name: context.repo.repo,
              });
              const boards = res.repository?.projectsV2?.nodes ?? [];
              if (!boards.length) {
                core.warning("No project boards linked to this repo - issue not added anywhere.");
                return;
              }

              // Owner mirrors the migration convention: assigned to a human = "You", else "Claude".
              const ownerValue = (issue.assignees ?? []).length ? "You" : "Claude";

              for (const board of boards) {
                const added = await github.graphql(
                  `mutation($project: ID!, $content: ID!) {
                    addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                      item { id }
                    }
                  }`,
                  { project: board.id, content: issue.node_id }
                );
                const itemId = added.addProjectV2ItemById.item.id;

                for (const [fieldName, valueName] of [["Status", "Backlog"], ["Owner", ownerValue]]) {
                  const field = await selectFieldFor(board.id, fieldName);
                  if (!field) continue;
                  const option = field.options.find((o) => o.name === valueName);
                  if (!option) continue;
                  await github.graphql(
                    `mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $project, itemId: $item, fieldId: $field,
                        value: { singleSelectOptionId: $value }
                      }) { projectV2Item { id } }
                    }`,
                    { project: board.id, item: itemId, field: field.id, value: option.id }
                  );
                }
                core.info(`${board.title}: added #${issue.number} (Backlog, Owner ${ownerValue})`);
              }
              core.notice(
                `#${issue.number} added to ${boards.length} board(s). Still needs triage: ` +
                `Priority, Difficulty, Milestone (epic), and a parent issue if it belongs under one.`
              );
            }

            if (context.eventName === "issues") {
              const action = context.payload.action;
              if (action === "opened") await onboardNewIssue(context.payload.issue);
              if (action === "closed") await setStatus(context.payload.issue.node_id, "Done");
              if (action === "reopened") await setStatus(context.payload.issue.node_id, "Spec Ready");
            }
