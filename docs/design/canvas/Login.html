<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #eff1e8; color: #18221c; }
a { color: #134736; } a:hover { color: #18221c; }
</style>
</helmet>
<div style="width: 900px; height: 700px; box-sizing: border-box; background: #eff1e8; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;">

  <div style="width: 420px; background: #fbfaf6; border-radius: 14px; box-shadow: 0 1px 2px rgba(24,34,28,.05), 0 12px 32px rgba(24,34,28,.10); padding: 36px 36px 32px;">
    <span style="width: 36px; height: 36px; border-radius: 11px; background: #18221c; color: #def36b; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600;">I</span>
    <h1 style="margin: 18px 0 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1;">Ik ben een appel</h1>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #4d574f;">An English job-search filter for people who do not speak Dutch.</p>

    <form style="margin-top: 26px; display: flex; flex-direction: column; gap: 16px;">
      <label style="display: block;">
        <span style="display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5d6660; margin-bottom: 6px;">Email</span>
        <input type="email" style="width: 100%; box-sizing: border-box; background: #fbfaf6; border: 1px solid #ddd9cc; border-radius: 8px; min-height: 48px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #18221c;">
      </label>
      <label style="display: block;">
        <span style="display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5d6660; margin-bottom: 6px;">Password</span>
        <input type="password" style="width: 100%; box-sizing: border-box; background: #fbfaf6; border: 1px solid #ddd9cc; border-radius: 8px; min-height: 48px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #18221c;">
      </label>
      <button type="submit" style="margin-top: 4px; background: #18221c; color: #ffffff; border: 0; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; padding: 15px; min-height: 48px; cursor: pointer;">Sign in</button>
    </form>

    <p style="margin: 20px 0 0; font-size: 14px; color: #4d574f; text-align: center;">Need an account? <a href="#register" style="font-weight: 700;">Register</a></p>
  </div>

  <p style="margin: 22px 0 0; width: 420px; font-size: 12px; line-height: 1.55; color: #4d574f; text-align: center;">Your searches and saved jobs stay on this server and are never sent to any job site. <a href="#sources">Where the jobs come from →</a></p>
</div>
</x-dc>
</body>
</html>
