# VPS-05 (#198), hardened T37: nginx front for the self-hosted target.
#
# This restores the edge burst brake that the Cloudflare native
# AUTH_RATE_LIMIT binding provided (30 requests per 60s per location). It is
# deliberately set far ABOVE the database budgets in lib/rate-limit.ts
# (registration 5 per 15 min per IP, login 20 per 15 min per IP, 10 per 15 min
# per email; verify/reset likewise in single digits per 15 min), so it never
# masks them: ordinary use — even a burst of retries — passes straight
# through to `durableRateLimit`, which keeps the exact 15-minute windows and
# is the accounting layer. Only a flood trips this.
#
# Layering, stated plainly because the trade is deliberate:
# - nginx limit_req fails by refusing with 503 here (nodelay + burst cap) —
#   a brake, not accounting.
# - `durableRateLimit` fails CLOSED (503) on a database error: admitting
#   password guesses because the counter is down would turn a storage fault
#   into an open door. Do not "fix" it to fail open.
# - `nativeRateLimit` fails OPEN and no-ops on a missing binding, which is the
#   self-hosted path: without the `ratelimits` configuration there is no edge
#   binding, `bindings()` returns no authRateLimiter, and the auth route skips
#   that layer entirely. That was safe only because the database limiter
#   behind it fails closed — the pairing matters, not either half alone.
#
# Install: include from the site's server block; adjust server_name and the
# upstream port to match the deployment. The Cloudflare `ratelimits` block in
# vite.config.ts stays until cutover (#201) — this file covers the
# self-hosted path only.
#
# T37 hardening notes:
# - TLS 1.2 minimum (1.3 preferred); certbot manages the certificate files.
#   Fill in the two ssl_certificate lines for the host before enabling.
# - Application security headers (CSP nonce, X-Frame-Options, HSTS, ...) are
#   set by the app itself (next.config.ts, middleware.ts) and verified by
#   tests/security-headers.test.ts. nginx MUST NOT add its own copies: a
#   second policy/header is enforced in addition, not instead, and a stale
#   proxy copy would silently override or intersect the app's current one.
# - The database, backups, secrets and source tree are NEVER served: the
#   deny blocks below return 404 (not 403, so a prober learns nothing about
#   what exists) for dotfiles, SQLite files, env/vars files, VCS metadata
#   and backup artefacts — even if a future document-root mistake exposes
#   a directory this file's author did not intend.

# Do not advertise the version in error pages or the Server header.
server_tokens off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

upstream ikbeneenappel {
    server 127.0.0.1:3000;
    # Single local upstream on purpose: the app holds one SQLite writer, so
    # there is nothing to balance across. Do not add a second upstream.
}

# Plain HTTP exists only to redirect. Nothing is served here.
server {
    listen 80;
    server_name ikbeneenappel.nl www.ikbeneenappel.nl;
    location / {
        return 301 https://ikbeneenappel.nl$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ikbeneenappel.nl;

    # Certificates (certbot-managed on the host; adjust paths to match).
    ssl_certificate /etc/letsencrypt/live/ikbeneenappel.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikbeneenappel.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Session tickets off: they keep session keys in the ticket key file
    # rather than in memory, which is a second secret to rotate and lose.
    ssl_session_tickets off;

    # Request brakes: the app never needs large uploads (no file upload
    # exists), so anything bigger than a form post is a probe or a mistake.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    # Never serve what must never be web-accessible, whatever the
    # document root ends up containing. 404, not 403: existence is itself
    # information. Covers: dotfiles, git metadata, SQLite/WAL files,
    # environment/secret files, wrangler state, backups and archives.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* ^/.*\.(sqlite|sqlite3|db|db-shm|db-wal|sqlite-shm|sqlite-wal|sql|bak|backup|pem|key)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* ^/(local-backups|outputs|work|tmp|\.local|\.wrangler|\.git)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Auth endpoints only: the brake exists for the sign-in budgets, not for
    # ordinary browsing. burst=20 nodelay absorbs a retry burst; sustained
    # flood past it is refused with 503 so it reads as "try later", not as a
    # failed login.
    location = /api/auth {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 503;
        proxy_pass http://ikbeneenappel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/auth/(verify|password-reset) {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 503;
        proxy_pass http://ikbeneenappel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ikbeneenappel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
